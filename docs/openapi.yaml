openapi: 3.0.3
info:
  title: Jungle Gaming API
  version: 0.1.0
  description: Contrato dos endpoints HTTP implementados nesta etapa.
servers:
  - url: http://127.0.0.1:8080
paths:
  /wagering/transactions:
    post:
      operationId: processWagerTransaction
      summary: Processa BET, WIN, LOSS, REFUND ou ROLLBACK do provedor autenticado
      description: |
        Aceita BET, WIN, REFUND e ROLLBACK com valor positivo e LOSS com valor zero. Exige wagering:write
        e vínculo do azp com providerId em OIDC_PROVIDER_CLIENTS. O serviço interno
        não pode apostar. O provedor do corpo deve coincidir com a identidade,
        inclusive nos replays. JSON estrito, sem campos extras ou duplicados,
        limitado a 16384 bytes. OPENING e outros tipos ainda não são aceitos.
        Confirma resultado, saldo, ledger e outbox no mesmo commit.
        WIN credita o prêmio; pode referenciar uma BET processada do mesmo provedor,
        jogador, carteira, moeda, rodada e jogo. O valor do prêmio pode ser diferente
        do valor apostado. Referência ausente ou ainda pendente produz PENDING_REFERENCE
        durável e HTTP 202, sem crédito. Um worker retoma com backoff exponencial
        (1s inicialmente, depois 2s, 4s, 8s, 16s, 30s...), máximo 8 tentativas ou
        TTL de 5 minutos. Esgotamento produz REFERENCE_NOT_FOUND, definitivamente.
        Referência incompatível produz REFERENCE_MISMATCH; aposta rejeitada produz
        REFERENCE_REJECTED. Overflow de saldo produz BALANCE_OVERFLOW.
        Não há aceite PENDING intermediário. Não publica eventos diretamente.
        LOSS exige money.amount equivalente a 0.00 na moeda da carteira. Confirma
        PROCESSED e somente WagerTransactionProcessed na outbox; não altera saldo,
        versão ou timestamps da carteira e não cria ledger. Não aceita referência.
        Replays preservam o saldo observado no LOSS original, mesmo após BET/WIN.
        REFUND exige referenceExternalTransactionId de uma BET processada do mesmo
        provedor, jogador, carteira, moeda, rodada e jogo. Devolve o valor integral;
        valor diferente gera REFERENCE_AMOUNT_MISMATCH. Uma BET só pode receber uma
        devolução bem-sucedida: outra operação retorna REJECTED/ALREADY_REVERSED.
        Duplicatas da mesma chave continuam sendo replays do resultado original.
        A referência ausente segue a retomada durável já descrita, com HTTP 202.
        ROLLBACK exige referência obrigatória a BET, WIN ou REFUND processado,
        com os mesmos provedor, jogador, carteira, moeda, rodada e jogo e valor integral.
        BET é desfeita com crédito; WIN e REFUND, com débito. Saldo insuficiente para
        desfazer crédito gera REVERSAL_INSUFFICIENT_FUNDS, distinto de INSUFFICIENT_FUNDS
        usado no BET. Referência pendente segue o mesmo worker durável. Referências
        a LOSS ou outro ROLLBACK são rejeitadas com REFERENCE_MISMATCH. Uma referência
        admite uma única reversão processada: REFUND e ROLLBACK da mesma BET competem
        pela mesma proteção; desfazer um REFUND não reabre essa BET para nova devolução.
        Chave e conteúdo equivalentes retornam o resultado original persistido,
        incluindo o saldo original, com idempotentReplay=true. Um ID externo
        enviado com outra chave gera conflito, mesmo com conteúdo equivalente.
        Repita a mesma requisição para acompanhar uma pendência: HTTP 202 enquanto
        aguarda, 200 após processamento ou 422 após rejeição. O transactionId é estável.
        Chaves e IDs externos são únicos por provedor, compartilhados por BET/WIN/LOSS/REFUND/ROLLBACK.
        SHA-256 usa JSON com chaves
        ordenadas de todos os campos do corpo, normalizando money.amount e
        excluindo Idempotency-Key e metadados de transporte. Referência opcional
        participa do hash quando presente; campo vazio ou null é inválido.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Uma única chave fornecida pelo chamador, não vazia, até 256 bytes.
          schema: {type: string, minLength: 1, maxLength: 256}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BetRequest'
                - $ref: '#/components/schemas/WinRequest'
                - $ref: '#/components/schemas/LossRequest'
                - $ref: '#/components/schemas/RefundRequest'
                - $ref: '#/components/schemas/RollbackRequest'
            example:
              providerId: provider-a
              externalTransactionId: bet-1
              playerId: player-1
              walletId: wallet-1
              roundId: round-1
              gameId: game-1
              kind: BET
              money: {amount: '25.00', currency: BRL}
      responses:
        '200':
          description: Operação confirmada ou replay; LOSS não movimenta saldo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetResult'
              example:
                transactionId: transaction-1
                status: PROCESSED
                balance: {amount: '75.00', currency: BRL}
                idempotentReplay: false
        '202':
          description: |
            WIN, REFUND ou ROLLBACK persistido aguardando referência, sem crédito. Balance é apenas
            o saldo observado na última tentativa, não um crédito confirmado.
            O evento WagerTransactionPendingReference está na outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetResult'
              example:
                transactionId: win-pending-1
                status: PENDING_REFERENCE
                balance: {amount: '100.00', currency: BRL}
                idempotentReplay: false
        '400':
          description: |
            Entrada corrigível, sem registro de transação. Códigos invalid_request
            (JSON, tipo, metadados ou dinheiro inválidos), invalid_idempotency_key
            (header ausente/duplicado/longo), invalid_bet, invalid_loss, invalid_refund ou invalid_rollback
            (carteira incompatível com jogador/moeda).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Carteira inexistente; nenhum resultado financeiro foi registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: wallet_not_found}
        '409':
          description: |
            idempotency_conflict para chave com outro conteúdo;
            external_transaction_conflict para ID externo com outra chave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Corpo maior que 16384 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type diferente de application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Rejeição definitiva persistida por saldo insuficiente, overflow ou
            referência inválida/rejeitada/esgotada. Não cria ledger
            nem altera saldo/versão; grava WagerTransactionRejected na outbox.
            Um replay preserva a rejeição e retorna este mesmo status HTTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetResult'
              example:
                transactionId: transaction-2
                status: REJECTED
                balance: {amount: '20.00', currency: BRL}
                failureCode: INSUFFICIENT_FUNDS
                idempotentReplay: false
        '500':
          description: |
            internal_error sem resultado durável ou replay de uma transação FAILED.
            FAILED usa BetResult com INFRASTRUCTURE_RETRIES_EXHAUSTED: as tentativas
            SQS esgotaram e a auditoria foi confirmada sem saldo, ledger ou outbox.
            Repetir a mesma identidade preserva a falha mesmo após recuperação.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/BetResult'
              examples:
                failed:
                  value:
                    transactionId: failed-transaction
                    status: FAILED
                    balance: {amount: '100.00', currency: BRL}
                    failureCode: INFRASTRUCTURE_RETRIES_EXHAUSTED
                    idempotentReplay: true
        '503':
          description: |
            service_unavailable para falha transitória no banco ou timeout;
            authentication_unavailable para consulta necessária ao IdP indisponível.
            Limite de processamento SQL: 5s. Não informa sucesso sem commit.
            Se o resultado do commit for incerto, repita a mesma chave e conteúdo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wallets:
    post:
      operationId: openWallet
      summary: Abre uma carteira pelo serviço interno
      description: |
        Exige o cliente jungle-internal e o papel wallets:write.
        Saldo positivo cria carteira, OPENING, crédito no ledger e dois eventos
        na outbox no mesmo commit. Saldo zero cria somente a carteira.
        O par (playerId, currency) é único; uma repetição resulta em conflito.
        O JSON deve ter somente os campos definidos, sem chaves duplicadas.
        O corpo é limitado a 16384 bytes. Dinheiro deve vir como string decimal.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
            example:
              playerId: player-1
              initialBalance: {amount: '100.00', currency: BRL}
      responses:
        '201':
          description: Abertura confirmada no banco.
          headers:
            Location:
              description: Caminho da carteira criada.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/InvalidWalletRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Já existe carteira para o mesmo jogador e moeda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: wallet_already_exists}
        '413':
          description: Corpo maior que 16384 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: body_too_large}
        '415':
          description: Content-Type ausente ou diferente de application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: unsupported_media_type}
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WalletServiceUnavailable'
  /wallets/{walletId}:
    get:
      operationId: findWalletByID
      summary: Consulta uma carteira pelo serviço interno
      description: Exige o cliente jungle-internal e o papel wallets:read. Não altera saldo ou versão.
      security:
        - BearerAuth: []
      parameters:
        - name: walletId
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Estado persistido da carteira.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/InvalidWalletRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Carteira não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: wallet_not_found}
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/WalletServiceUnavailable'
  /wagering/transactions/{transactionId}:
    get:
      operationId: findTransaction
      summary: Consulta uma transação pelo ID interno
      description: Exige wagering:read para provedor vinculado ou wallets:read para o serviço interno. Provedor só enxerga suas transações; ID interno de outra origem retorna 404. Inclui OPENING somente para o serviço interno. Não reaplica a operação nem altera o resultado persistido.
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Resultado persistido da consulta. Nunca reaplica movimentações.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Identificador ou parâmetros inválidos (invalid_request); cursor inválido, de outra carteira ou além da versão atual (invalid_cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Transação não visível (transaction_not_found) ou carteira inexistente (wallet_not_found), conforme a rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco ou autenticação indisponível; timeout ou cancelamento. Códigos service_unavailable e authentication_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /providers/{providerId}/wagering/transactions/{externalTransactionId}:
    get:
      operationId: findExternalTransaction
      summary: Consulta uma transação pelo ID externo
      description: Exige wagering:read para o provedor vinculado ou wallets:read para o serviço interno. ProviderId de outro provedor retorna 403 antes da busca. Consulta sempre pelo par providerId/externalTransactionId.
      security:
        - BearerAuth: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: externalTransactionId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Resultado persistido da consulta. Nunca reaplica movimentações.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Identificador ou parâmetros inválidos (invalid_request); cursor inválido, de outra carteira ou além da versão atual (invalid_cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Transação não visível (transaction_not_found) ou carteira inexistente (wallet_not_found), conforme a rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco ou autenticação indisponível; timeout ou cancelamento. Códigos service_unavailable e authentication_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wallets/{walletId}/ledger:
    get:
      operationId: listLedger
      summary: Consulta o extrato paginado da carteira
      description: Exige serviço interno com wallets:read. Ordena por walletVersion e ID do lançamento, crescentes. A primeira página fixa snapshotVersion; o cursor opaco preserva esse limite nas páginas seguintes, excluindo novas movimentações. Inclui OPENING; LOSS e rejeições não criam ledger. Sem offset. Cursor pertence à carteira e não substitui autorização. Limite padrão 50, máximo 100; parâmetros duplicados, desconhecidos ou inválidos retornam 400.
      security:
        - BearerAuth: []
      parameters:
        - name: walletId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 2048}
          description: Use o nextCursor da página anterior sem interpretar ou modificar.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Resultado persistido da consulta. Nunca reaplica movimentações.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '400':
          description: Identificador ou parâmetros inválidos (invalid_request); cursor inválido, de outra carteira ou além da versão atual (invalid_cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Transação não visível (transaction_not_found) ou carteira inexistente (wallet_not_found), conforme a rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco ou autenticação indisponível; timeout ou cancelamento. Códigos service_unavailable e authentication_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /wallets/{walletId}/reconciliation:
    post:
      operationId: reconcileWallet
      summary: Confere o saldo usando o ledger
      description: Exige serviço interno com wallets:read. POST sem corpo ou parâmetros. Uma única visão consistente do PostgreSQL compara saldo e soma exata dos créditos menos débitos, incluindo OPENING. Difference é storedBalance menos calculatedBalance. Divergência retorna 200 com consistent=false, registra log e incrementa métrica; não altera carteira, ledger, transações ou eventos. Valores calculados usam strings decimais exatas, inclusive negativos e divergências além de int64.
      security:
        - BearerAuth: []
      parameters:
        - name: walletId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Resultado persistido da consulta. Nunca reaplica movimentações.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
        '400':
          description: Identificador ou parâmetros inválidos (invalid_request); cursor inválido, de outra carteira ou além da versão atual (invalid_cursor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Transação não visível (transaction_not_found) ou carteira inexistente (wallet_not_found), conforme a rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Banco ou autenticação indisponível; timeout ou cancelamento. Códigos service_unavailable e authentication_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metrics:
    get:
      operationId: getMetrics
      summary: Consulta métricas financeiras, processamento, SQS e outbox
      description: |
        Exige serviço interno com wallets:read. Formato Prometheus. Contadores
        jungle_wager_responses_total por transporte/tipo/status (incluem replays),
        jungle_wager_duplicates_total, jungle_wager_conflicts_total por motivo e
        histograma jungle_wager_processing_seconds do caso de uso HTTP/SQS.
        Inclui contadores de reconciliação, consumo/retry SQS e publicação da outbox.
        jungle_wager_transactions representa operações únicas persistidas por tipo/status;
        jungle_reference_attempts, jungle_outbox_unpublished e jungle_outbox_lag_seconds
        também vêm do banco. jungle_sqs_dlq_messages consulta quantidades aproximadas
        visíveis, em voo e atrasadas das DLQs habilitadas, sem consumir mensagens.
        Scrape paralelo com deadline global de 2s. Falha de uma fonte mantém HTTP 200
        e jungle_metrics_source_up=0 para ela, omitindo suas amostras sem expor erros.
        Contadores/histogramas pertencem ao processo e reiniciam com ele. Gauges do
        banco/filas são compartilhados: agregar por max, não somar entre réplicas.
        Labels limitados a enums, sem IDs de jogador, carteira ou provedor.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contadores/histogramas do processo e snapshots das fontes disponíveis.
          content:
            text/plain:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/AuthenticationUnavailable'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Verifica a disponibilidade das dependências habilitadas
      description: |
        Endpoint público, sem autenticação e sem cache. Executa Ping no pool PostgreSQL
        e consulta atributos das filas/DLQs dos módulos SQS habilitados, em paralelo,
        com prazo total de 2 segundos e cancelamento pelo contexto da requisição.
        Não publica, recebe ou remove mensagens, nem grava dados financeiros.
        Módulos SQS desabilitados aparecem como disabled e não bloqueiam prontidão.
        Uma falha, timeout, configuração FIFO/redrive inválida ou acesso negado
        resulta em unavailable e HTTP 503, sem expor URLs, credenciais ou erros internos.
        A checagem de metadados não testa envio/consumo de mensagens ou o Keycloak.
      security: []
      responses:
        '200':
          description: PostgreSQL e todos os módulos SQS habilitados estão acessíveis.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Readiness'
                  - type: object
                    properties:
                      status: {type: string, enum: [ready]}
              example:
                status: ready
                checks: {postgres: ok, sqsConsumer: ok, sqsPublisher: ok}
        '503':
          description: Ao menos uma dependência necessária está indisponível ou excedeu o prazo.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Readiness'
                  - type: object
                    properties:
                      status: {type: string, enum: [not_ready]}
              example:
                status: not_ready
                checks: {postgres: ok, sqsConsumer: unavailable, sqsPublisher: disabled}
        '405':
          description: Método diferente de GET não é suportado neste caminho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health/live:
    get:
      operationId: getLiveness
      summary: Verifica se o processo responde a requisições HTTP
      description: |
        Endpoint público, sem autenticação e sem efeitos colaterais.
        Não consulta PostgreSQL ou SQS e não representa readiness.
      security: []
      responses:
        '200':
          description: O processo responde.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '405':
          description: Método diferente de GET não é suportado neste caminho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: method_not_allowed
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token RS256 emitido pelo realm jungle, com audiência jungle-api.
        Rotas de carteira exigem também o cliente jungle-internal e o papel
        wallets:read ou wallets:write conforme a operação.
        Consultas de transação exigem wagering:read para provedores; o serviço interno usa wallets:read.
        BET/WIN/LOSS/REFUND/ROLLBACK exigem wagering:write e vínculo entre azp e providerId.
  responses:
    InvalidWalletRequest:
      description: |
        JSON inválido, campos ausentes, desconhecidos ou duplicados, tipo incorreto,
        jogador/ID inválido ou valor/moeda inválidos. Códigos possíveis:
        invalid_request, invalid_player_id, invalid_wallet_id, invalid_amount,
        invalid_currency.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: invalid_request}
    InternalError:
      description: Falha interna; não informa sucesso sem confirmação da operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: internal_error}
    WalletServiceUnavailable:
      description: |
        Falha transitória de persistência, timeout/cancelamento ou consulta
        necessária ao IdP indisponível. Códigos: service_unavailable ou
        authentication_unavailable. Em uma falha de conexão ao redor do commit,
        o resultado pode ser indeterminado; não presuma que uma nova tentativa
        realizará uma nova abertura. A unicidade de jogador/moeda impede duplicação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: service_unavailable}
    Unauthorized:
      description: Bearer ausente, malformado, expirado ou inválido.
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: unauthorized}
    Forbidden:
      description: Identidade autenticada sem cliente ou permissão exigidos.
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: forbidden}
    AuthenticationUnavailable:
      description: Consulta necessária ao IdP indisponível ou com timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {error: authentication_unavailable}
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: object
          additionalProperties: false
          required: [postgres, sqsConsumer, sqsPublisher]
          properties:
            postgres: {type: string, enum: [ok, unavailable]}
            sqsConsumer: {type: string, enum: [ok, unavailable, disabled]}
            sqsPublisher: {type: string, enum: [ok, unavailable, disabled]}
    Transaction:
      type: object
      additionalProperties: false
      required: [transactionId, origin, kind, status, walletId, playerId, money, balance, walletVersion, createdAt, updatedAt]
      description: Projeção de leitura. Não expõe chave de idempotência ou hash. Balance é o saldo observado na execução ou na última tentativa pendente, não o saldo atual da carteira.
      properties:
        transactionId: {type: string}
        origin: {type: string, enum: [INTERNAL, EXTERNAL]}
        kind: {type: string, enum: [OPENING, BET, WIN, LOSS, REFUND, ROLLBACK]}
        status: {type: string, enum: [PROCESSED, REJECTED, PENDING_REFERENCE, FAILED]}
        providerId: {type: string}
        externalTransactionId: {type: string}
        walletId: {type: string}
        playerId: {type: string}
        roundId: {type: string}
        gameId: {type: string}
        money:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
        walletVersion: {type: integer, format: int64, minimum: 1}
        failureCode: {type: string, description: Presente em REJECTED ou FAILED.}
        referenceExternalTransactionId: {type: string}
        referenceTransactionId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LedgerEntry:
      type: object
      additionalProperties: false
      required: [id, walletId, transactionId, kind, direction, money, balanceBefore, balanceAfter, walletVersion, createdAt]
      properties:
        id: {type: string}
        walletId: {type: string}
        transactionId: {type: string}
        kind: {type: string, enum: [OPENING, BET, WIN, REFUND, ROLLBACK]}
        direction: {type: string, enum: [CREDIT, DEBIT]}
        money:
          $ref: '#/components/schemas/Money'
        balanceBefore:
          $ref: '#/components/schemas/Money'
        balanceAfter:
          $ref: '#/components/schemas/Money'
        walletVersion: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
    LedgerPage:
      type: object
      additionalProperties: false
      required: [walletId, snapshotVersion, entries]
      properties:
        walletId: {type: string}
        snapshotVersion: {type: integer, format: int64, minimum: 1}
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor: {type: string, description: Ausente na última página.}
    AuditMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      description: Valor derivado exato em auditoria, inclusive negativo e além de int64 em divergências; nunca aceito como entrada financeira.
      properties:
        amount: {type: string, pattern: '^-?[0-9]+\.[0-9]{2}$'}
        currency: {type: string, enum: [BRL, USD]}
    Reconciliation:
      type: object
      additionalProperties: false
      required: [walletId, storedBalance, calculatedBalance, difference, consistent, checkedEntries]
      properties:
        walletId: {type: string}
        storedBalance:
          $ref: '#/components/schemas/Money'
        calculatedBalance:
          $ref: '#/components/schemas/AuditMoney'
        difference:
          $ref: '#/components/schemas/AuditMoney'
        consistent: {type: boolean}
        checkedEntries: {type: integer, format: int64, minimum: 0}
    BetRequest:
      type: object
      additionalProperties: false
      required: [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money]
      description: Identificadores não vazios, preservados sem trim e limitados a 256 bytes UTF-8.
      properties:
        providerId: {type: string, minLength: 1, maxLength: 256}
        externalTransactionId: {type: string, minLength: 1, maxLength: 256}
        playerId: {type: string, minLength: 1, maxLength: 256}
        walletId: {type: string, minLength: 1, maxLength: 256}
        roundId: {type: string, minLength: 1, maxLength: 256}
        gameId: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [BET]}
        money:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Valor estritamente positivo, na moeda da carteira.
    WinRequest:
      type: object
      additionalProperties: false
      required: [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money]
      properties:
        providerId: {type: string, minLength: 1, maxLength: 256}
        externalTransactionId: {type: string, minLength: 1, maxLength: 256}
        playerId: {type: string, minLength: 1, maxLength: 256}
        walletId: {type: string, minLength: 1, maxLength: 256}
        roundId: {type: string, minLength: 1, maxLength: 256}
        gameId: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [WIN]}
        money:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Crédito estritamente positivo na moeda da carteira, sem arredondamento.
        referenceExternalTransactionId:
          type: string
          minLength: 1
          maxLength: 256
          description: ID externo de BET do mesmo provedor, carteira, jogador, moeda, rodada e jogo. Não aceita null, vazio ou autorreferência.
    LossRequest:
      type: object
      additionalProperties: false
      required: [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money]
      description: LOSS registra o resultado sem movimentação financeira. Identificadores até 256 bytes UTF-8, não vazios.
      properties:
        providerId: {type: string, minLength: 1, maxLength: 256}
        externalTransactionId: {type: string, minLength: 1, maxLength: 256}
        playerId: {type: string, minLength: 1, maxLength: 256}
        walletId: {type: string, minLength: 1, maxLength: 256}
        roundId: {type: string, minLength: 1, maxLength: 256}
        gameId: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [LOSS]}
        money:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount:
              type: string
              pattern: '^0+\.00$'
              example: '0.00'
              description: Exige zero com duas casas; zeros à esquerda são normalizados antes do hash.
            currency:
              type: string
              enum: [BRL, USD]
              description: Deve ser igual à moeda da carteira.
    RefundRequest:
      type: object
      additionalProperties: false
      required: [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money, referenceExternalTransactionId]
      properties:
        providerId: {type: string, minLength: 1, maxLength: 256}
        externalTransactionId: {type: string, minLength: 1, maxLength: 256}
        playerId: {type: string, minLength: 1, maxLength: 256}
        walletId: {type: string, minLength: 1, maxLength: 256}
        roundId: {type: string, minLength: 1, maxLength: 256}
        gameId: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [REFUND]}
        money:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Positivo e exatamente igual ao valor da BET referenciada; não aceita devolução parcial.
        referenceExternalTransactionId:
          type: string
          minLength: 1
          maxLength: 256
          description: Obrigatório. BET do mesmo provedor, jogador, carteira, moeda, rodada e jogo.
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money, referenceExternalTransactionId]
      properties:
        providerId: {type: string, minLength: 1, maxLength: 256}
        externalTransactionId: {type: string, minLength: 1, maxLength: 256}
        playerId: {type: string, minLength: 1, maxLength: 256}
        walletId: {type: string, minLength: 1, maxLength: 256}
        roundId: {type: string, minLength: 1, maxLength: 256}
        gameId: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [ROLLBACK]}
        money:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Positivo e exatamente igual ao valor da operação referenciada; não aceita devolução parcial.
        referenceExternalTransactionId:
          type: string
          minLength: 1
          maxLength: 256
          description: Obrigatório. BET, WIN ou REFUND do mesmo provedor, jogador, carteira, moeda, rodada e jogo.
    BetResult:
      type: object
      additionalProperties: false
      required: [transactionId, status, balance, idempotentReplay]
      properties:
        transactionId: {type: string}
        status: {type: string, enum: [PROCESSED, REJECTED, PENDING_REFERENCE, FAILED]}
        balance:
          $ref: '#/components/schemas/Money'
        failureCode:
          type: string
          enum: [INSUFFICIENT_FUNDS, BALANCE_OVERFLOW, REFERENCE_MISMATCH, REFERENCE_REJECTED, REFERENCE_NOT_FOUND, REFERENCE_AMOUNT_MISMATCH, ALREADY_REVERSED, REVERSAL_INSUFFICIENT_FUNDS, INFRASTRUCTURE_RETRIES_EXHAUSTED]
          description: Presente em REJECTED ou FAILED; infraestrutura esgotada usa INFRASTRUCTURE_RETRIES_EXHAUSTED.
        idempotentReplay: {type: boolean}
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: |
            Decimal não negativo com duas casas; máximo 92233720368547758.07.
            Zeros à esquerda são aceitos e normalizados na resposta.
          example: '100.00'
        currency:
          type: string
          enum: [BRL, USD]
    OpenWalletRequest:
      type: object
      additionalProperties: false
      required: [playerId, initialBalance]
      properties:
        playerId:
          type: string
          minLength: 1
          description: Deve conter ao menos um caractere diferente de espaço.
        initialBalance:
          $ref: '#/components/schemas/Money'
    Wallet:
      type: object
      additionalProperties: false
      required: [id, playerId, balance, version]
      properties:
        id: {type: string}
        playerId: {type: string}
        balance:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          format: int64
          minimum: 1
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
