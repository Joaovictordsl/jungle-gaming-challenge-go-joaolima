services:
  postgres:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local
      - POSTGRES_DB=jungle

    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "jungle"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "./migrations:/migrations:ro"
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - "postgres://postgres:postgres_local@postgres:5432/jungle?sslmode=disable&search_path=public"
    command: ["up"]

volumes:
  postgres_data:
