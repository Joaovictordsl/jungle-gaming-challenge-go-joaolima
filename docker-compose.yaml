services:
  postgres:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local
      - POSTGRES_DB=jungle

    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "jungle"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      POSTGRES_DB: keycloak
    volumes:
      - "keycloak_postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:-jungle_internal_local}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - "./docker/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro"
      - "./docker/keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "./migrations:/migrations:ro"
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - "postgres://postgres:postgres_local@postgres:5432/jungle?sslmode=disable&search_path=public"
    command: ["up"]

volumes:
  postgres_data:
  keycloak_postgres_data:
