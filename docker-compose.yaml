services:
  localstack:
    image: localstack/localstack-pro:2026.10.0
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: sqs,iam,sts
      ENFORCE_IAM: "1"
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - "localstack_data:/var/lib/localstack"
      - "./docker/localstack/init-sqs.py:/etc/localstack/init/ready.d/10-init-sqs.py:ro"
      - "./docker/localstack/healthcheck.py:/etc/localstack/jungle-healthcheck.py:ro"
      - "./docker/localstack/verify-sqs.py:/etc/localstack/verify-sqs.py:ro"
      - "./docker/localstack/verify-iam.py:/etc/localstack/verify-iam.py:ro"
      - "./docker/localstack/send-wager.py:/etc/localstack/send-wager.py:ro"
    healthcheck:
      test: ["CMD", "/opt/code/localstack/.venv/bin/python", "/etc/localstack/jungle-healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local
      - POSTGRES_DB=jungle

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "jungle"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      POSTGRES_DB: keycloak
    volumes:
      - "keycloak_postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_INTERNAL_CLIENT_SECRET: ${KEYCLOAK_INTERNAL_CLIENT_SECRET:-jungle_internal_local}
      KEYCLOAK_PROVIDER_A_CLIENT_SECRET: ${KEYCLOAK_PROVIDER_A_CLIENT_SECRET:-jungle_provider_a_local}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - "./docker/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro"
      - "./docker/keycloak/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "./migrations:/migrations:ro"
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - "postgres://postgres:postgres_local@postgres:5432/jungle?sslmode=disable&search_path=public"
    command: ["up"]

volumes:
  localstack_data:
  postgres_data:
  keycloak_postgres_data:
